dataset:
  dataset_name: "imerg"
  img_height: 128
  img_width: 128
  input_seq_len: 0          # No conditioning frames; VAE trains on one frame at a time
  output_seq_len: 1          # One target frame per sample
  data_dir: "../../data/required_south"   # Update this to your preprocessed IMERG directory
  aug_mode: "0"              # Augmentation mode (if desired; "0" disables augmentation)
  ret_contiguous: true       # Return contiguous tensors
  val_ratio: 0.05             # Fraction of samples for validation (and test)
  batch_size: 16             # Batch size for training
  seed: 0                   # Random seed for reproducibility
  downsample: 0             # 0 -> no downsample, 1 -> 256x256, 2 -> 128x128 (This is needed if we are using original 512x512, in our case we have already downscaled to 128x128)
layout:
  layout: "NHWC"
optim:
  total_batch_size: 16
  micro_batch_size: 2
  float32_matmul_precision: "high"
  seed: 0
  method: "adam"
  lr: 5e-6
  wd: 1e-5
  betas: [0.5, 0.9]
  gradient_clip_val: 1.0
  max_epochs: 8
  # scheduler
  warmup_percentage: 0.1
  lr_scheduler_mode: "cosine"
  min_lr_ratio: 1.0e-3
  warmup_min_lr_ratio: 0.1
  # early stopping
  monitor: "val/total_loss"
  early_stop: false
  early_stop_mode: "min"
  early_stop_patience: 5
  save_top_k: 1
logging:
  logging_prefix: "VAE_GAN_IMERG"
  monitor_lr: true
  monitor_device: false
  track_grad_norm: -1
  use_wandb: false
trainer:
  check_val_every_n_epoch: 1
  log_step_ratio: 0.001
  precision: 32
  find_unused_parameters: True
  num_sanity_val_steps: 2
eval:
  train_example_data_idx_list: [0, ]
  val_example_data_idx_list: [0, ]
  test_example_data_idx_list: [0, 16, 32, 48, 64, 72, 96, 108, 128]
  eval_example_only: false
  num_vis: 10
model:
  data_channels: 1
  down_block_types: ['DownEncoderBlock2D', 'DownEncoderBlock2D', 'DownEncoderBlock2D', 'DownEncoderBlock2D']
  in_channels: 1
  block_out_channels: [128, 256, 512, 512]  # downsample `len(block_out_channels) - 1` times
  act_fn: 'silu'
  latent_channels: 64
  up_block_types: ['UpDecoderBlock2D', 'UpDecoderBlock2D', 'UpDecoderBlock2D', 'UpDecoderBlock2D']
  norm_num_groups: 32
  layers_per_block: 2
  out_channels: 1
  loss:
    disc_start: 50001
    kl_weight: 1e-6
    disc_weight: 0.5
    perceptual_weight: 0.0  # IMERG does not have RGB channels
    disc_in_channels: 1
