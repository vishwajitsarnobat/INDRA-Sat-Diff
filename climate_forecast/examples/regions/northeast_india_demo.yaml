# Northeast India, 0.1 deg IMERG, 128x128 grid. Demo period: Assam-Meghalaya floods (Cherrapunji ~972 mm on 17 Jun).
# Usage:
#   climate-forecast download   --config climate_forecast/examples/regions/northeast_india_demo.yaml
#   climate-forecast preprocess --config climate_forecast/examples/regions/northeast_india_demo.yaml

download:
  product: IMERG_FINAL_HH_V07        # or IMERG_LATE_HH_V07 / IMERG_EARLY_HH_V07 (near real time)
  periods:
    - {start: "2022-06-13T00:00", end: "2022-06-18T23:30"}
  workers: 6

preprocess:
  input_dir: "data/raw/northeast_india"
  output_dir: "data/processed/northeast_india"
  lat_range: [19.1, 31.9]
  lon_range: [86.1, 98.9]
  raw_data_coordinate_order: ['lon', 'lat']   # OPeNDAP subset keeps IMERG's (time, lon, lat) order
  downscale_factor: 1
  clip_value: 100.0
  num_processes: 4

data:
  path: "data/processed/northeast_india"
  channels: ['precipitation']
  latitude_variable_name: 'lat'
  longitude_variable_name: 'lon'
  time_variable_name: 'time'
  time_interval_minutes: 30
