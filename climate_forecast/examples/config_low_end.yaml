# =============================================================================
#   LOW-END / PROTOTYPING CONFIG — Limited GPU (≤6 GB VRAM) or CPU
# =============================================================================
# Target hardware: Laptop GPUs (GTX 1650, RTX 3050), integrated graphics,
#                  or low-VRAM desktop cards (GTX 1060, RX 580).
# This config reduces model size, spatial resolution, and batch size to
# fit within ~4-6 GB VRAM while still producing meaningful results.
#
# Overrides the framework defaults (climate_forecast/configs/train.yaml)
# with a smaller architecture and conservative training settings.

pipeline:
  output_dir: "training_output_low_end"
  model_checkpoint_path: "training_output_low_end/indra_sat_diff/checkpoints/indra_sat_diff_final.pt"

preprocess:
  input_dir: "data"
  output_dir: "processed_data"
  lat_range: [5, 17.8]
  lon_range: [71, 83.8]
  raw_data_coordinate_order: ['lon', 'lat']
  num_processes: 4                         # Fewer CPU cores on typical laptops

data:
  path: "processed_data"
  channels: ['Grid/precipitation']
  latitude_variable_name: 'Grid/lat'
  longitude_variable_name: 'Grid/lon'
  time_variable_name: 'Grid/time'
  time_interval_minutes: 30
  shuffle: true
  num_workers: 2                           # Gentle on memory bandwidth
  val_ratio: 0.05
  test_ratio: 0.05
  metrics_mode: "1"
  metrics_list: ['csi', 'pod', 'far', 'sucr', 'bias', 'fss']
  threshold_list: [2.5, 7.6, 16.0, 50.0]

layout:
  in_len: 7
  out_len: 6
  img_height: 64                           # Half resolution = ¼ the pixels
  img_width: 64
  layout: "NTHWC"

optim:
  total_batch_size: 2                      # Effectively no gradient accumulation
  micro_batch_size: 1                      # Single sample per step
  max_epochs: 30                           # Fewer epochs for faster iteration
  method: "adamw"
  lr: 0.0001
  wd: 0.01
  betas: [0.9, 0.999]
  monitor: "val/loss"
  gradient_clip_val: 1.0

trainer:
  precision: "16-mixed"                    # Still use mixed precision if GPU supports it
  log_every_n_steps: 50

visualization:
  denorm_clip_value: 100.0
  colorbar_label: "Precipitation (mm/hr)"
  boundaries: [0.0, 0.1, 2.5, 7.6, 16.0, 50.0, 100.0]

model:
  # --- VAE: Reduced capacity ---
  vae:
    pretrained_ckpt_path: null
    in_channels: 1
    out_channels: 1
    latent_channels: 32                    # Smaller latent space
    down_block_types: ['DownEncoderBlock2D', 'DownEncoderBlock2D', 'DownEncoderBlock2D']
    up_block_types: ['UpDecoderBlock2D', 'UpDecoderBlock2D', 'UpDecoderBlock2D']
    block_out_channels: [64, 128, 256]     # Narrower channels
    layers_per_block: 1                    # Fewer layers per block
    act_fn: 'silu'
    norm_num_groups: 16                    # Smaller group norm
    loss:
      disc_start: 50001
      kl_weight: 1.0e-6
      disc_weight: 0.5
      perceptual_weight: 0.0
      disc_in_channels: 1

  # --- Alignment: Reduced capacity ---
  align:
    model_ckpt_path: null
    alignment_type: "avg_x"
    guide_scale: 50.0
    model_type: "cuboid"
    model_args:
      input_shape: null
      out_channels: 1
      base_units: 64                       # Half the base channels
      scale_alpha: 1.0
      depth: [1]                           # Single block instead of two
      downsample: 2
      downsample_type: "patch_merge"
      block_attn_patterns: "axial"
      num_heads: 4
      attn_drop: 0.1
      proj_drop: 0.1
      ffn_drop: 0.1
      ffn_activation: "gelu"
      gated_ffn: false
      norm_layer: "layer_norm"
      use_inter_ffn: true
      pos_embed_type: "t+h+w"
      padding_type: "zeros"
      checkpoint_level: 0
      use_relative_pos: true
      self_attn_use_final_proj: true
      num_global_vectors: 0
      use_global_vector_ffn: true
      use_global_self_attn: false
      separate_global_qkv: false
      global_dim_ratio: 1
      time_embed_channels_mult: 4
      time_embed_use_scale_shift_norm: false
      time_embed_dropout: 0.0
      pool: "attention"
      readout_seq: true
      out_len: null

  # --- Latent Diffusion Model: Reduced capacity ---
  latent_model:
    input_shape: null
    target_shape: null
    base_units: 128                        # Smaller base width
    scale_alpha: 1.0
    num_heads: 4
    attn_drop: 0.1
    proj_drop: 0.1
    ffn_drop: 0.1
    downsample: 2
    downsample_type: "patch_merge"
    upsample_type: "upsample"
    upsample_kernel_size: 3
    depth: [2, 2]                          # Shallower blocks
    block_attn_patterns: "axial"
    num_global_vectors: 0
    use_global_vector_ffn: false
    use_global_self_attn: true
    separate_global_qkv: true
    global_dim_ratio: 1
    ffn_activation: "gelu"
    gated_ffn: false
    norm_layer: "layer_norm"
    padding_type: "zeros"
    pos_embed_type: "t+h+w"
    checkpoint_level: 0
    use_relative_pos: true
    self_attn_use_final_proj: true
    time_embed_channels_mult: 4
    time_embed_use_scale_shift_norm: false
    time_embed_dropout: 0.0
    unet_res_connect: true

  # --- Diffusion: Fewer timesteps for faster training ---
  diffusion:
    layout: "NTHWC"
    data_shape: null
    timesteps: 500                         # Half the diffusion steps
    beta_schedule: "linear"
    use_ema: true
    loss_type: "l2"
    linear_start: 1.0e-4
    linear_end: 2.0e-2
    cosine_s: 8.0e-3
    given_betas: null
    original_elbo_weight: 0.0
    v_posterior: 0.0
    l_simple_weight: 1.0
    parameterization: "eps"
    learn_logvar: false
    logvar_init: 0.0
    latent_shape: null
    cond_stage_model: "__is_first_stage__"
    num_timesteps_cond: null
    cond_stage_trainable: false
    cond_stage_forward: null
    scale_by_std: false
    scale_factor: 1.0

forecast: {}
